services:
  postgres:
    image: postgres:16
    container_name: orders-postgres
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: orders-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    container_name: orders-localstack
    environment:
      SERVICES: sqs,s3
    ports:
      - "4566:4566"
